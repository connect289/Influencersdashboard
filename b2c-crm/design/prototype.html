<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eduwit B2C CRM Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>/* Layout concept: a calm desk. Navy ink on white paper for work; amber only where something needs the eye
   (hot, at risk, the one Call per screen). Fine navy hairlines instead of shadows. No black in light mode. */
:root {
  --bg: #FFFFFF; --surface: #F8F9FA; --surface-2: #EEF0F3; --line: #D7DEE5; --line-strong: #778CA4;
  --ink: #052244; --muted: #516D8C; --primary: #072E5A; --primary-hover: #052244; --on-primary: #FFFFFF; --primary-soft: #E6EAEE;
  --amber: #F4A504; --on-amber: #052244; --amber-soft: #FDF1D7; --amber-ink: #7F5602;
  --red: #B42318; --red-soft: #FEF3F2; --green: #067647; --green-soft: #ECFDF3; --focus: #072E5A;
  --shadow: 0 1px 2px rgba(7, 46, 90, .06), 0 8px 24px rgba(7, 46, 90, .08);
  --scrim: rgba(5, 34, 68, .38);
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px; --r-sm: 7px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #020D19; --surface: #031224; --surface-2: #041932; --line: #1B3557; --line-strong: #6A829C;
    --ink: #F0F2F5; --muted: #A1B0C0; --primary: #B5C0CE; --primary-hover: #C8D1DB; --on-primary: #020D19; --primary-soft: #0A2748;
    --amber: #F4A504; --on-amber: #020D19; --amber-soft: #2E2C1E; --amber-ink: #F7BC43;
    --red: #F97066; --red-soft: #2A1416; --green: #47CD89; --green-soft: #0D2419; --focus: #F4A504;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35); --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #020D19; --surface: #031224; --surface-2: #041932; --line: #1B3557; --line-strong: #6A829C;
  --ink: #F0F2F5; --muted: #A1B0C0; --primary: #B5C0CE; --primary-hover: #C8D1DB; --on-primary: #020D19; --primary-soft: #0A2748;
  --amber: #F4A504; --on-amber: #020D19; --amber-soft: #2E2C1E; --amber-ink: #F7BC43;
  --red: #F97066; --red-soft: #2A1416; --green: #47CD89; --green-soft: #0D2419; --focus: #F4A504;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35); --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--surface-2); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 22px; font-weight: 650; }
h2 { font-size: 16px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 600; }
p { margin: 0; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
a { color: var(--primary); }

/* ---------- review bar (not part of the product) ---------- */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.proto .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; margin-right: auto; }
.proto .brand small { font-weight: 500; color: var(--muted); }
.logo { width: 26px; height: 26px; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 10px; font-size: 13px; font-weight: 550; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.sample { font-size: 12px; color: var(--amber-ink); background: var(--amber-soft); padding: 3px 8px; border-radius: 999px; font-weight: 600; }

.stage { padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stage.desk { padding: 0; }

/* ---------- shared bits ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 14px; border: 1px solid transparent; line-height: 1.2; white-space: nowrap; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.primary:hover { background: var(--primary-hover); }
.btn.call { background: var(--amber); color: var(--on-amber); }
.btn.ghost { background: transparent; border-color: var(--line-strong); color: var(--ink); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.quiet { background: transparent; color: var(--primary); padding-inline: 8px; }
.btn.danger { background: var(--red); color: var(--bg); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon.s { width: 15px; height: 15px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.5; }
.chip.hot { background: var(--amber); color: var(--on-amber); }
.chip.warm { background: var(--amber-soft); color: var(--amber-ink); }
.chip.cold, .chip.soft { background: var(--primary-soft); color: var(--ink); }
.chip.risk { background: var(--amber-soft); color: var(--amber-ink); }
.chip.breach { background: var(--red-soft); color: var(--red); }
.chip.ok { background: var(--green-soft); color: var(--green); }
.chip.line { border: 1px solid var(--line-strong); color: var(--muted); padding: 1px 7px; }
.chip.bar { background: var(--surface-2); color: var(--ink); border: 1px dashed var(--line-strong); padding: 1px 7px; }

.card { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); }
.card.pad { padding: 14px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.divider { height: 1px; background: var(--line); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--ink); font-size: 12px; font-weight: 650; flex: none; }
.avatar.lg { width: 44px; height: 44px; font-size: 15px; }
.kv { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
.field { display: grid; gap: 4px; font-size: 13px; }
.field > span { color: var(--muted); font-weight: 550; }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
textarea.input { min-height: 72px; resize: vertical; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { border: 1px solid var(--line-strong); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 550; }
.pill[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 9px 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--amber); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--muted); background: var(--surface); font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface); }
.bar-track { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar-fill { height: 100%; background: var(--primary); border-radius: 99px; }
.bar-fill.amber { background: var(--amber); }
.note { font-size: 12px; color: var(--muted); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-sm); background: var(--amber-soft); color: var(--amber-ink); font-size: 13px; }
.banner.info { background: var(--primary-soft); color: var(--ink); }
.banner.danger { background: var(--red-soft); color: var(--red); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 550; z-index: 90; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

/* ---------- Sales app ---------- */
.phone { width: 390px; max-width: 100%; height: 800px; max-height: calc(100vh - 110px); min-height: 560px; margin: 0 auto; border: 1px solid var(--line-strong); border-radius: 34px; overflow: hidden; background: var(--bg); box-shadow: var(--shadow); position: relative; display: flex; flex-direction: column; }
.phone .statusbar { height: 30px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; font-size: 12px; font-weight: 600; font-family: var(--mono); }
.sales { display: flex; flex-direction: column; min-height: 0; flex: 1; background: var(--bg); }
.s-head { padding: 10px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); flex: none; }
.s-head h1 { font-size: 19px; }
.s-body { flex: 1; overflow-y: auto; padding: 14px 16px 20px; display: grid; gap: 14px; align-content: start; min-height: 0; }
.bottom-nav { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--bg); padding-bottom: 6px; }
.bottom-nav button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 8px 0 4px; font-size: 11px; font-weight: 600; color: var(--muted); position: relative; }
.bottom-nav button[aria-current="page"] { color: var(--ink); }
.bottom-nav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 2px; background: var(--amber); border-radius: 2px; }
.badge-dot { position: absolute; top: 6px; right: calc(50% - 16px); min-width: 16px; height: 16px; border-radius: 99px; background: var(--amber); color: var(--on-amber); font-size: 10px; display: grid; place-items: center; padding: 0 4px; }

.qcard { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); text-align: left; width: 100%; }
.qcard.breach { border-color: var(--red); }
.qcard .name { font-weight: 650; }
.qcard .sub { grid-column: 2 / 4; font-size: 12px; color: var(--muted); }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-title h2 { font-size: 14px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { border: 1px solid var(--line); border-radius: var(--r); padding: 10px; background: var(--bg); display: grid; gap: 4px; }
.kpi b { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; }
.kpi .bar-track { height: 4px; }
.fu-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.fu-card { border: 1px solid var(--line); border-radius: var(--r); padding: 8px; background: var(--bg); text-align: left; display: grid; gap: 2px; }
.fu-card b { font-family: var(--mono); font-size: 20px; font-weight: 600; }
.fu-card span { font-size: 11px; color: var(--muted); font-weight: 600; }
.fu-card[aria-pressed="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.fu-card.alert b { color: var(--red); }
.list { display: grid; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--bg); }
.li { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; padding: 11px 12px; border-bottom: 1px solid var(--line); background: var(--bg); text-align: left; border-left: 0; border-right: 0; border-top: 0; width: 100%; }
.li:last-child { border-bottom: 0; }
.li:hover { background: var(--surface); }
.li .t { font-weight: 600; }
.li .s { grid-column: 2 / 4; font-size: 12px; color: var(--muted); }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 10px; background: var(--bg); }
.search input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; }
.hscroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.hscroll .pill { flex: none; }

.plain { background: none; border: 0; padding: 0; margin: 0; text-align: left; color: inherit; font: inherit; cursor: pointer; min-width: 0; }

/* lead screen */
.lead-head { display: grid; gap: 10px; }
.lead-actions { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; }
.brief { border-left: 3px solid var(--amber); padding: 10px 12px; background: var(--surface); border-radius: 0 var(--r-sm) var(--r-sm) 0; display: grid; gap: 4px; font-size: 13px; }
.brief li { margin-left: 16px; }
.brief ul { margin: 0; padding: 0; display: grid; gap: 3px; }
.panel { border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
.panel > header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.panel > .body { padding: 12px; display: grid; gap: 10px; }
.contact { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; font-size: 13px; }
.contact .lbl { grid-column: 2; font-size: 11px; color: var(--muted); }
.tl { display: grid; gap: 0; }
.tl-item { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.tl-item:last-child { border-bottom: 0; }
.tl-item time { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.tl-kind { font-size: 11px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

/* sheets */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 30; display: flex; align-items: flex-end; }
.sheet { background: var(--bg); width: 100%; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 8px 16px 18px; display: grid; gap: 14px; }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line-strong); margin: 4px auto 0; }
.scrim.center { align-items: center; justify-content: center; padding: 16px; }
.scrim.center .sheet { border-radius: 16px; max-width: 520px; }
.dialer { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 16px 0; }
.dialer .bignum { font-family: var(--mono); font-size: 26px; font-weight: 600; letter-spacing: .02em; }
.qr { width: 132px; height: 132px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: #FFFFFF; }

/* inbox */
.thread { display: grid; gap: 8px; align-content: start; }
.msg { max-width: 82%; padding: 8px 11px; border-radius: 12px; font-size: 13px; display: grid; gap: 3px; }
.msg.in { background: var(--surface-2); justify-self: start; border-bottom-left-radius: 4px; }
.msg.out { background: var(--primary-soft); justify-self: end; border-bottom-right-radius: 4px; }
.msg .meta { font-size: 11px; color: var(--muted); display: flex; gap: 6px; justify-content: flex-end; }
.msg .tpl { font-size: 11px; font-weight: 650; color: var(--amber-ink); }
.composer { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 8px; background: var(--bg); flex: none; }
.window { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.tpl-card { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px; display: grid; gap: 6px; text-align: left; background: var(--bg); width: 100%; }
.tpl-card[aria-pressed="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.tpl-card code { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* kanban */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.kcol { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; display: grid; gap: 8px; align-content: start; min-height: 160px; }
.kcol header { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; font-weight: 650; }
.kcard { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px; display: grid; gap: 4px; font-size: 12px; text-align: left; width: 100%; }
.kcard b { font-size: 13px; }

/* ---------- desktop shells ---------- */
.desk-shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100vh - 52px); background: var(--bg); }
.side { border-right: 1px solid var(--line); background: var(--surface); padding: 14px 10px; display: grid; gap: 2px; align-content: start; position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto; }
.side .who { display: flex; gap: 10px; align-items: center; padding: 6px 8px 14px; }
.side .group { font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 4px; }
.side button.nav { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 7px 10px; border-radius: 8px; font-weight: 550; color: var(--ink); text-align: left; width: 100%; }
.side button.nav:hover { background: var(--surface-2); }
.side button.nav[aria-current="page"] { background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); font-weight: 650; }
.side button.nav[aria-current="page"] .icon { color: var(--amber-ink); }
.side .count { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.main { min-width: 0; display: grid; align-content: start; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--bg); flex-wrap: wrap; }
.topbar h1 { margin-right: auto; }
.content { padding: 20px 24px 40px; display: grid; gap: 16px; min-width: 0; }
.cmdk { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px; color: var(--muted); background: var(--bg); min-width: 220px; }
.cmdk kbd { margin-left: auto; font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-lead { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
.stat { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; background: var(--bg); display: grid; gap: 6px; align-content: start; }
.stat b { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.delta { font-size: 12px; font-weight: 600; }
.delta.up { color: var(--green); }
.delta.down { color: var(--red); }
.readonly-flag { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
svg.chart text { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
svg.chart .gridl { stroke: var(--line); stroke-width: 1; }
.funnel-row { display: grid; grid-template-columns: 170px 1fr 70px; gap: 10px; align-items: center; font-size: 13px; }
.funnel-row .bar-track { height: 18px; border-radius: 5px; }
.funnel-row .bar-fill { border-radius: 5px; }

/* journey canvas */
.canvas { background-color: var(--surface); background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 16px 16px; border: 1px solid var(--line); border-radius: var(--r); padding: 24px; display: grid; justify-items: center; gap: 0; overflow-x: auto; }
.node { width: min(360px, 100%); border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; }
.node .k { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--primary-soft); grid-row: span 2; }
.node.trigger .k { background: var(--amber); color: var(--on-amber); }
.node.exit .k { background: var(--surface-2); }
.node .t { font-weight: 600; font-size: 13px; }
.node .s { grid-column: 2; font-size: 12px; color: var(--muted); }
.node .n { grid-row: 1 / 3; grid-column: 3; font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
.edge { width: 1px; height: 22px; background: var(--line-strong); }
.calendar { display: grid; grid-template-columns: 120px repeat(7, minmax(0, 1fr)); font-size: 12px; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--bg); }
.calendar > div { padding: 7px 8px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); min-height: 34px; }
.calendar .h { background: var(--surface); font-weight: 650; color: var(--muted); }
.shift { background: var(--primary-soft); border-radius: 5px; padding: 2px 6px; font-weight: 600; font-family: var(--mono); font-size: 11px; display: inline-block; }
.shift.off { background: transparent; color: var(--muted); border: 1px dashed var(--line-strong); }
.shift.leave { background: var(--amber-soft); color: var(--amber-ink); font-family: var(--font); }

/* Sales desktop: same app, sidebar layout */
.sales-desk .s-body { padding: 20px 24px 40px; }

/* narrow screens: the review page itself on a phone */
@media (max-width: 900px) {
  .desk-shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; display: flex; overflow-x: auto; padding: 8px; gap: 4px; border-right: 0; border-bottom: 1px solid var(--line); }
  .side .who, .side .group, .side .count { display: none; }
  .side button.nav { width: auto; white-space: nowrap; }
  .g2, .g3, .g-lead { grid-template-columns: 1fr; }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .content, .topbar { padding-left: 16px; padding-right: 16px; }
  .cmdk { min-width: 0; }
}
@media (max-width: 440px) {
  .stage:not(.desk) { padding: 0; }
  .phone { border: 0; border-radius: 0; height: calc(100vh - 96px); max-height: none; box-shadow: none; }
  .phone .statusbar { display: none; }
  .funnel-row { grid-template-columns: 110px 1fr 56px; }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(16px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

/* tiny charts, drawn to scale */
function lineChart(series, { w = 520, h = 160, labels = [], max } = {}) {
  const pad = { l: 30, r: 10, t: 10, b: 22 };
  const all = series.flatMap(s => s.data); const top = max ?? (Math.ceil(Math.max(...all) / 10) * 10 || 10);
  const x = i => pad.l + i * (w - pad.l - pad.r) / (series[0].data.length - 1);
  const y = v => pad.t + (h - pad.t - pad.b) * (1 - v / top);
  const ticks = [0, top / 2, top];
  let g = ticks.map(t => `<line class="gridl" x1="${pad.l}" x2="${w - pad.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${pad.l - 6}" y="${y(t) + 3}" text-anchor="end">${t}</text>`).join('');
  g += labels.map((l, i) => l ? `<text x="${x(i)}" y="${h - 6}" text-anchor="middle">${l}</text>` : '').join('');
  const paths = series.map(s => {
    const pts = s.data.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const last = s.data.length - 1;
    const area = s.area ? `<polygon points="${x(0)},${y(0)} ${pts} ${x(last)},${y(0)}" fill="${s.color}" opacity=".10"/>` : '';
    return `${area}<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(last)}" cy="${y(s.data[last])}" r="3.2" fill="${s.color}"/>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img">${g}${paths}</svg>`;
}
function barsChart(rows, { w = 520, h = 170, color = 'var(--primary)' } = {}) {
  const pad = { l: 30, r: 8, t: 10, b: 22 }; const top = Math.ceil(Math.max(...rows.map(r => r[1])) / 10) * 10 || 10;
  const bw = (w - pad.l - pad.r) / rows.length; const y = v => pad.t + (h - pad.t - pad.b) * (1 - v / top);
  let g = [0, top / 2, top].map(t => `<line class="gridl" x1="${pad.l}" x2="${w - pad.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${pad.l - 6}" y="${y(t) + 3}" text-anchor="end">${t}</text>`).join('');
  g += rows.map((r, i) => `<rect x="${pad.l + i * bw + bw * .18}" y="${y(r[1])}" width="${bw * .64}" height="${y(0) - y(r[1])}" rx="3" fill="${r[2] || color}"/><text x="${pad.l + i * bw + bw / 2}" y="${h - 6}" text-anchor="middle">${r[0]}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img">${g}</svg>`;
}

function qr() {
  // stand-in for the real code, which encodes tel:+919000000012
  const finder = (x, y) => { const m = Math.max(Math.abs(x - 3), Math.abs(y - 3)); return m === 3 || m <= 1; };
  let s = ''; let seed = 7;
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
    seed = (seed * 9301 + 49297) % 233280;
    let on;
    if (x < 7 && y < 7) on = finder(x, y); else if (x > 13 && y < 7) on = finder(x - 14, y); else if (x < 7 && y > 13) on = finder(x, y - 14);
    else if (x < 8 && y < 8 || x > 12 && y < 8 || x < 8 && y > 12) on = false; else on = seed / 233280 > .5;
    if (on) s += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg class="qr" viewBox="0 0 21 21" fill="#072E5A" aria-label="QR code to dial on your phone">${s}</svg>`;
}
