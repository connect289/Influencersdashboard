# Eduwit B2B CRM: typecheck, unit tests, build and dependency scanning of b2b-crm/web (estate audit, 30 Oct 2026: the
# B2B CRM was the only app without CI), and the database migrations and SQL suites on a throwaway local PostgreSQL (M34i).
# Runs on pull requests and pushes that touch the web app or b2b-crm/supabase. No secrets are used and no Supabase project
# is reached: the unit tests mock every network call, the build reads no environment values, and local-test.sh starts its
# own server on a private socket with stubs of the Supabase platform.
name: b2b-crm CI

on:
  pull_request:
    paths:
      - "b2b-crm/web/**"
      - "b2b-crm/supabase/**"
      - ".github/workflows/b2b-crm-ci.yml"
  push:
    branches: [main]
    paths:
      - "b2b-crm/web/**"
      - "b2b-crm/supabase/**"
      - ".github/workflows/b2b-crm-ci.yml"

permissions:
  contents: read

concurrency:
  group: b2b-crm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: b2b-crm/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: b2b-crm/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # Blocking: a high or critical advisory in a production dependency fails the build (the audit of 30 Oct found a
      # critical Next.js advisory that nothing had flagged). Dev-only tools are left to Dependabot.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  sql:
    name: Migrations and SQL suites (local PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: b2b-crm/supabase
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The runner image ships PostgreSQL server binaries (not running); install them only if an image ever drops them.
      - name: PostgreSQL binaries
        run: ls /usr/lib/postgresql/*/bin/initdb || (sudo apt-get update && sudo apt-get install -y postgresql)
      # Every migration applied in deploy order and then re-applied, then every file in tests/local-suite.txt; a row with
      # ok = false fails the job. Offline: nothing leaves the runner.
      - name: Local SQL test
        run: ./local-test.sh

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
